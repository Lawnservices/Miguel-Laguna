<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="https://img.icons8.com/fluency/48/null/price-tag-usd.png" type="image/x-icon">
 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4007547067098323"
     crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href=" prices.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mesa.css">
  <title>Prices</title>
</head>


<body>
  <header> 
    <nav> 
    <ul>
      <li><a href="./index">Home</a></li>
     <li><a href="contact">Contact Us</a></li>
      </ul>
      </nav>
  </header>
<div class="w3-container w3-green">
  <h4>Call now <em class="tel">(240)883-8479</em></h4>
</div>
<div class="servicio">
   Business Hours: Monday to Friday 07:00 AM to 04:00 PM
</div>   
      
<div class="container">
       

        <table>
        <caption class="titulo">
          THE BEST PRICES IN THE AREA.
        </caption>
            <thead>
                <tr>
                    <th>Icon</th>
                    <th>Services</th>
                    <th>Description</th>
                    <th>Prices</th>
                </tr>
            </thead>
            <tbody id="servicesTable"></tbody>
        </table>
    </div>
      
   
 
  <footer class="w3-container w3-green">
  <p>©<em id="year"></em>Miguel Laguna Lawn Services. All Rights Reserved.</p>
</footer>
<script src="script/script.js"></script>
<script src="saludo/script.js"></script>
<script src="mesa.js"></script>
 <script>
        async function loadServices() {
            const table = document.getElementById("servicesTable");

            try {
                const res = await fetch("https://www.creantunegocio.com/api/services");
                const data = await res.json();

                table.innerHTML = "";

                data.services.forEach(s => {
                    table.innerHTML += `
<tr>
<td><img class="icon" src="${s.icon || 'https://via.placeholder.com/45'}"></td>
<td><b>${s.service}</b></td>
<td>${s.description || "Professional lawn service"}</td>
<td class="price">$${s.price}</td>
</tr>`;
                });

            } catch (e) {
                table.innerHTML = '<tr><td colspan="4">Error loading services</td></tr>';
            }
        }

        loadServices();
    </script>
</body>

</html>
